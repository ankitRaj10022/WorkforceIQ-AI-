version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm install --workspace=@workforceiq/web lightningcss-linux-x64-gnu@1.32.0 --no-save
        build:
          commands:
            - npm run build:web
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
