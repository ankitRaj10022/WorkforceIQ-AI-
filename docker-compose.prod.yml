services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ${WORKFORCEIQ_ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: gunicorn -c gunicorn.conf.py run:app

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  celery_worker:
    build: .
    env_file:
      - ${WORKFORCEIQ_ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "celery -A workforceiq.celery_app.celery worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}"

volumes:
  redis_data:
