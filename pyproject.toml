[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=workforceiq --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["workforceiq"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__", "instance"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/backup_database.py" = ["E402"]
"scripts/seed_demo_data.py" = ["E402"]
"scripts/verify_backup.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B104"]
