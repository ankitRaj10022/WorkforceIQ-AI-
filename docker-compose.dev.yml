services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ${WORKFORCEIQ_ENV_FILE:-.env}
    environment:
      WORKFORCEIQ_CONFIG: development
      DATABASE_URL: mysql+pymysql://workforceiq:devpass@db:3306/workforceiq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLASK_RUN_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "flask db upgrade && flask run --reload --host=0.0.0.0 --port=5000"
    volumes:
      - .:/app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: workforceiq
      MYSQL_USER: workforceiq
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    profiles:
      - search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  celery_worker:
    build: .
    env_file:
      - ${WORKFORCEIQ_ENV_FILE:-.env}
    environment:
      WORKFORCEIQ_CONFIG: development
      DATABASE_URL: mysql+pymysql://workforceiq:devpass@db:3306/workforceiq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workforceiq.celery_app.celery worker --loglevel=info
    volumes:
      - .:/app

  flower:
    build: .
    env_file:
      - ${WORKFORCEIQ_ENV_FILE:-.env}
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - celery_worker
    command: celery -A workforceiq.celery_app.celery flower --port=5555

volumes:
  mysql_data:
