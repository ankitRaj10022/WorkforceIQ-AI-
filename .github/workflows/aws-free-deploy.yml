name: AWS Free-Tier Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Type DEPLOY to push the image and restart the free-tier EC2 stack"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.inputs.deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push one small image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_FREE_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Restart free-tier EC2 stack through SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_FREE_EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/workforceiq",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker compose -f docker-compose.free.yml --env-file .env.free pull",
              "docker compose -f docker-compose.free.yml --env-file .env.free up -d",
              "docker compose -f docker-compose.free.yml --env-file .env.free ps"
            ]
          }
          EOF
          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$AWS_EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy WorkforceIQ free-tier containers" \
              --parameters file://ssm-commands.json \
              --query "Command.CommandId" \
              --output text
          )"
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_EC2_INSTANCE_ID"

      - name: Verify public health endpoint
        env:
          HEALTH_URL: ${{ secrets.AWS_FREE_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "AWS_FREE_HEALTH_URL is not set, skipping health probe."
            exit 0
          fi

          for attempt in $(seq 1 20); do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            sleep 15
          done

          echo "Public health endpoint did not respond in time: $HEALTH_URL" >&2
          exit 1
