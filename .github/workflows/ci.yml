name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Security scan
        run: python -m bandit -c pyproject.toml -r workforceiq scripts

      - name: Tests with coverage gate
        run: python -m pytest

      - name: Validate Docker compose files
        env:
          WORKFORCEIQ_ENV_FILE: .env.example
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config > /dev/null
          docker compose -f docker-compose.dev.yml config > /dev/null
          WORKFORCEIQ_ENV_FILE=.env.production.example docker compose -f docker-compose.prod.yml config > /dev/null
          (cd cloud/compose && WORKFORCEIQ_CONTAINER_ENV_FILE=env.cloud.example docker compose -f docker-compose.cloud.yml --env-file env.cloud.example config > /dev/null)

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t workforceiq-api:ci .
