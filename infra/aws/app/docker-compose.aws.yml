services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${WORKFORCEIQ_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.aws
    volumes:
      - ./backups:/app/backups
      - ./global-bundle.pem:/opt/workforceiq/global-bundle.pem:ro
    command: sh -c "flask db upgrade && gunicorn -c gunicorn.conf.py run:app"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    image: ${WORKFORCEIQ_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.aws
    volumes:
      - ./global-bundle.pem:/opt/workforceiq/global-bundle.pem:ro
    command: celery -A workforceiq.celery_app.celery worker --loglevel=info
    depends_on:
      app:
        condition: service_healthy
